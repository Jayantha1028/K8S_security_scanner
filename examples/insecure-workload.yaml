apiVersion: v1
kind: Pod
metadata:
  name: insecure-api
  namespace: default
  labels:
    app: insecure-api
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: web
    image: nginx:latest
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      readOnlyRootFilesystem: false
      capabilities:
        add: ["SYS_ADMIN"]
    resources: {}
