# Kubernetes Native Security Operator - Turnkey CRD Manifests
# Apply with: kubectl apply -f deploy/crds/turnkey-crds.yaml

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securitypolicies.security.k8s.io
spec:
  group: security.k8s.io
  names:
    kind: SecurityPolicy
    listKind: SecurityPolicyList
    plural: securitypolicies
    singular: securitypolicy
    shortNames:
      - secpol
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                minComplianceScore:
                  type: number
                  minimum: 0.0
                  maximum: 100.0
                  default: 80.0
                enforceNonRoot:
                  type: boolean
                  default: true
                disallowPrivileged:
                  type: boolean
                  default: true
                requireReadOnlyRootFilesystem:
                  type: boolean
                  default: false
                blockedCapabilities:
                  type: array
                  items:
                    type: string
                  default: ["SYS_ADMIN", "NET_ADMIN", "ALL"]
                allowedRegistries:
                  type: array
                  items:
                    type: string
                  default: ["*.ecr.aws", "*.gcr.io", "*.azurecr.io", "docker.io/library"]
            status:
              type: object
              properties:
                phase:
                  type: string
                compliantWorkloads:
                  type: integer
                failingWorkloads:
                  type: integer
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustercomplianceaudits.security.k8s.io
spec:
  group: security.k8s.io
  names:
    kind: ClusterComplianceAudit
    listKind: ClusterComplianceAuditList
    plural: clustercomplianceaudits
    singular: clustercomplianceaudit
    shortNames:
      - comaudit
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                auditSchedule:
                  type: string
                  default: "0 * * * *"
                targetNamespaces:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                lastAuditTimestamp:
                  type: string
                overallScore:
                  type: number
                status:
                  type: string
                findingsCount:
                  type: integer
