name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Runtime & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install -e .

      - name: Execute Full Test Suite
        run: |
          python3 -m unittest discover tests -v

      - name: Self-Dogfooding Security Scan
        run: |
          python3 cli.py scan deploy/k8s/turnkey-operator.yaml --ci-check --min-score 95.0
          python3 cli.py compliance deploy/k8s/turnkey-operator.yaml --framework all
